<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hush</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231B2431'/%3E%3Crect x='6' y='17' width='20' height='7' fill='%23F4D35E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --fog:#E4E9E7;
  --sheet:#F6F8F5;
  --ink:#1B2431;
  --muted:#566170;
  --rule:#C8D0CD;
  --hl:#F4D35E;
  --brick:#9E3B2A;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fog);color:var(--ink);font:400 16px/1.5 var(--display)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.shell{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,48px) clamp(16px,4vw,40px) 80px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.word{margin:0;font:800 clamp(48px,9vw,76px)/.88 var(--display);letter-spacing:-.035em}
.promise{margin:16px 0 0;max-width:34ch;font:500 clamp(18px,2.4vw,22px)/1.3 var(--display)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who input{width:150px}

input,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:9px 11px;width:100%}
textarea{min-height:76px;resize:vertical;font-family:var(--serif);font-size:17px;line-height:1.5}
::placeholder{color:#7b8591}
.primary{border:0;border-radius:6px;background:var(--ink);color:var(--sheet);padding:10px 18px;font:600 15px var(--display);cursor:pointer;white-space:nowrap}
.primary:hover{background:#2b384c}

h2{margin:0;font:700 20px/1.2 var(--display)}
h3{margin:0 0 6px;font:700 15px/1.3 var(--display)}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:44px;align-items:start}
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:36px}
@media (max-width:860px){
  .grid{grid-template-columns:1fr;gap:36px}
  .side{position:static}
}

/* the ledger: one sheet of paper, everything else sits on the page */
.ledger{background:var(--sheet);border-radius:2px;padding:28px clamp(18px,3vw,32px) 24px;box-shadow:0 0 0 1px var(--rule)}
.ledger-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tally{margin:0;font-size:14px;color:var(--muted)}
.empty,.error{margin:18px 0;color:var(--muted)}
.error{color:var(--brick)}

.mem{padding:16px 0 14px;border-top:1px solid var(--rule)}
.mem:first-of-type{border-top:0}
.body{margin:0 0 10px}

/* private text is redacted, shared text is highlighted */
.txt{
  font-family:var(--serif);font-size:18px;line-height:1.75;
  padding:0 .18em;margin:0 -.18em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  background-image:linear-gradient(var(--hl),var(--hl));
  background-repeat:no-repeat;background-position:0 72%;background-size:0% 52%;
  background-color:transparent;
  transition:background-size .5s ease,background-color .3s ease,color .3s ease;
}
.mem.shared .txt{background-size:100% 52%}
.mem.private .txt{background-color:var(--ink);color:transparent;cursor:pointer}
.mem.private .txt:hover,.mem.private .txt:focus-visible,.mem.private .txt.peek{color:var(--sheet)}

.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.when{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:5px 12px;font:600 13px var(--display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg button.is-shared[aria-pressed="true"]{background:var(--hl);color:var(--ink)}
.forget{margin-left:auto;background:none;border:0;border-radius:6px;color:var(--brick);font:600 13px var(--display);text-decoration:underline;text-underline-offset:3px;padding:5px 8px;cursor:pointer}
.forget.armed{background:var(--brick);color:#fff;text-decoration:none}

.add{margin-top:10px;padding-top:20px;border-top:2px solid var(--ink)}
.add label{display:block;margin-bottom:8px;font-weight:600}
.add-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.hint{margin:6px 0 0;font-size:13px;color:var(--muted)}

/* side column */
.panel{border-top:2px solid var(--ink);padding-top:14px}
.ask-row{display:flex;gap:8px;margin-top:12px}
.how{margin:14px 0 8px;font-size:14px;color:var(--muted)}
.answer-text{font:400 19px/1.6 var(--serif);white-space:pre-wrap;margin:0 0 20px}
.snip{margin:6px 0;font:400 16px/1.7 var(--serif)}
.hl{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 78%/100% 55%;padding:0 .15em;margin:0 -.15em}
.seen,.kept{margin-bottom:18px}
.bar{display:block;height:15px;background:var(--ink);margin:7px 0}
.kept p{margin:8px 0 0;font-size:14px;color:var(--muted)}
details{margin-top:6px}
summary{cursor:pointer;font:600 14px var(--display)}
.step{border-left:3px solid var(--ink);padding-left:12px;margin:12px 0}
.step h4{margin:0 0 4px;font:700 14px var(--display)}
.step pre{margin:0;white-space:pre-wrap;word-break:break-word;font:400 15px/1.6 var(--serif)}

.log{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:12px;font-size:14px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.log span small{display:block;color:var(--muted);font-size:13px}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <div>
      <h1 class="word">Hush</h1>
      <p class="promise">Everything you say is kept. Only what you highlight is ever shown to an agent.</p>
    </div>
    <form id="whoForm" class="who">
      <label for="uid">Signed in as</label>
      <input id="uid" value="arsheen" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit">Switch</button>
    </form>
  </header>

  <main class="grid">

    <section class="ledger" aria-labelledby="ledgerTitle">
      <div class="ledger-head">
        <h2 id="ledgerTitle">Memories</h2>
        <p id="tally" class="tally"></p>
      </div>
      <div id="memories"></div>

      <form id="addForm" class="add">
        <label for="newText">Add a memory by typing</label>
        <textarea id="newText" placeholder="Something you would say to Omi"></textarea>
        <div class="add-row">
          <div id="addSegSlot"></div>
          <button class="primary" type="submit">Save memory</button>
        </div>
        <p class="hint">New memories start private. Agents never see a private memory.</p>
      </form>
    </section>

    <aside class="side">
      <section class="panel" aria-labelledby="askTitle">
        <h2 id="askTitle">Ask Hush</h2>
        <form id="askForm" class="ask-row">
          <input id="question" placeholder="What do I need to do for Rahul?" autocomplete="off" aria-label="Your question">
          <button class="primary" type="submit">Ask</button>
        </form>
        <div id="answer" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="actTitle">
        <h2 id="actTitle">Activity</h2>
        <div id="audit" class="log"></div>
      </section>
    </aside>

  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const uid = () => $('uid').value.trim() || 'arsheen';
const enc = encodeURIComponent;
let items = [];
let newVis = 'private';

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function jsonOpts(method, body) {
  return {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)};
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = '';
    try { msg = (await r.json()).detail || ''; } catch (_) {}
    throw new Error(msg || ('the server answered ' + r.status));
  }
  return r.json();
}

/* two-option control: Private or Shared */
function segmented(current, onPick) {
  const wrap = el('div', 'seg');
  wrap.setAttribute('role', 'group');
  wrap.setAttribute('aria-label', 'Who can see this memory');
  const btns = {};
  ['private', 'shared'].forEach(v => {
    const b = el('button', 'is-' + v, v === 'private' ? 'Private' : 'Shared');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(v === current));
    b.onclick = () => onPick(v);
    btns[v] = b;
    wrap.appendChild(b);
  });
  wrap.set = v => { for (const k in btns) btns[k].setAttribute('aria-pressed', String(k === v)); };
  return wrap;
}

function renderTally() {
  const shared = items.filter(m => m.visibility === 'shared').length;
  $('tally').textContent = items.length
    ? shared + ' shared with agents, ' + (items.length - shared) + ' private'
    : '';
}

function memRow(m) {
  const row = el('article', 'mem ' + m.visibility);
  const p = el('p', 'body');
  const t = el('span', 'txt', m.text);
  t.tabIndex = 0;
  t.onclick = () => { if (m.visibility === 'private') t.classList.toggle('peek'); };
  p.appendChild(t);
  row.appendChild(p);

  const foot = el('div', 'foot');
  const when = new Date(m.ts * 1000).toLocaleString([], {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'});
  foot.appendChild(el('span', 'when', (m.source === 'omi' ? 'Heard by Omi, ' : 'Typed in, ') + when));

  const seg = segmented(m.visibility, async v => {
    if (v === m.visibility) return;
    try {
      await api('/memories/' + m.id, jsonOpts('PATCH', {uid: uid(), visibility: v}));
      m.visibility = v;
      row.className = 'mem ' + v;
      seg.set(v);
      t.classList.remove('peek');
      renderTally();
      loadAudit();
    } catch (e) { alert("Couldn't change who can see this memory: " + e.message); }
  });
  foot.appendChild(seg);

  const del = el('button', 'forget', 'Forget');
  del.type = 'button';
  let timer;
  del.onclick = async () => {
    if (!del.classList.contains('armed')) {
      del.classList.add('armed');
      del.textContent = 'Forget for good';
      timer = setTimeout(() => { del.classList.remove('armed'); del.textContent = 'Forget'; }, 4000);
      return;
    }
    clearTimeout(timer);
    try {
      await api('/memories/' + m.id + '?uid=' + enc(uid()), {method: 'DELETE'});
      items = items.filter(x => x.id !== m.id);
      row.remove();
      renderTally();
      if (!items.length) loadMemories();
      loadAudit();
    } catch (e) { alert("Couldn't forget this memory: " + e.message); }
  };
  foot.appendChild(del);

  row.appendChild(foot);
  return row;
}

async function loadMemories() {
  const box = $('memories');
  try {
    items = await api('/memories?uid=' + enc(uid()));
    renderTally();
    box.textContent = '';
    if (!items.length) {
      box.appendChild(el('p', 'empty', 'Nothing here yet. Speak to Omi, or type a memory below.'));
      return;
    }
    items.forEach(m => box.appendChild(memRow(m)));
  } catch (e) {
    box.textContent = '';
    box.appendChild(el('p', 'error', "Couldn't load memories: " + e.message));
  }
}

const MODE_TEXT = {
  lyzr_multi_agent: 'Answered by two agents: one drafted, one checked it for privacy.',
  lyzr: 'Answered by one agent.',
  fallback: "The agents couldn't be reached, so these are the best matching shared memories.",
  no_context: 'No shared memory matched this question.'
};
const AGENT_NAME = {answer_agent: 'Answer agent', privacy_reviewer: 'Privacy reviewer'};
const BAR_W = [88, 61, 94, 72, 53, 81];

async function ask() {
  const question = $('question').value.trim();
  if (!question) return;
  const box = $('answer');
  box.textContent = '';
  box.appendChild(el('p', 'how', 'Asking the agents...'));
  try {
    const r = await api('/ask', jsonOpts('POST', {uid: uid(), question}));
    box.textContent = '';
    box.appendChild(el('p', 'how', MODE_TEXT[r.mode] || r.mode));
    box.appendChild(el('div', 'answer-text', r.answer));

    const seen = el('div', 'seen');
    seen.appendChild(el('h3', '', 'What the agents saw'));
    if (r.shared_used.length) {
      r.shared_used.forEach(s => {
        const line = el('p', 'snip');
        line.appendChild(el('span', 'hl', s.text));
        seen.appendChild(line);
      });
    } else {
      seen.appendChild(el('p', 'snip', 'Nothing. No shared memory matched.'));
    }
    box.appendChild(seen);

    const kept = el('div', 'kept');
    kept.appendChild(el('h3', '', 'What stayed hidden'));
    for (let i = 0; i < Math.min(r.private_withheld, 6); i++) {
      const b = el('span', 'bar');
      b.style.width = BAR_W[i] + '%';
      kept.appendChild(b);
    }
    kept.appendChild(el('p', '', r.private_withheld
      ? r.private_withheld + (r.private_withheld === 1 ? ' private memory was' : ' private memories were') + ' kept from the agents.'
      : 'You have no private memories to keep back.'));
    box.appendChild(kept);

    if (r.steps && r.steps.length) {
      const d = document.createElement('details');
      d.appendChild(el('summary', '', r.steps.length > 1 ? 'How the two agents worked' : 'How the agent worked'));
      r.steps.forEach(s => {
        const st = el('div', 'step');
        st.appendChild(el('h4', '', AGENT_NAME[s.agent] || s.agent));
        st.appendChild(el('pre', '', s.output));
        d.appendChild(st);
      });
      box.appendChild(d);
    }
  } catch (e) {
    box.textContent = '';
    box.appendChild(el('p', 'error', "Couldn't get an answer: " + e.message));
  }
  loadAudit();
}

const EVENT_TEXT = {
  memory_stored: 'Saved a memory',
  visibility_changed: 'Changed who can see a memory',
  memory_deleted: 'Forgot a memory',
  question_received: 'Received a question',
  memories_retrieved: 'Chose memories for the agents',
  agent_answered: 'The answer agent replied',
  agent_reviewed: 'The privacy reviewer replied',
  answered: 'Sent the answer back',
  lyzr_failed: 'An agent call failed'
};
const SHOW_DETAIL = ['memories_retrieved', 'answered', 'lyzr_failed'];

async function loadAudit() {
  const box = $('audit');
  try {
    const ev = await api('/audit?uid=' + enc(uid()));
    box.textContent = '';
    if (!ev.length) { box.appendChild(el('span', '', 'Nothing has happened yet.')); return; }
    ev.slice(0, 30).forEach(e => {
      box.appendChild(el('time', '', new Date(e.ts * 1000).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})));
      const s = el('span', '', EVENT_TEXT[e.event] || e.event);
      if (SHOW_DETAIL.includes(e.event) && e.detail) s.appendChild(el('small', '', e.detail));
      box.appendChild(s);
    });
  } catch (e) {
    box.textContent = '';
    box.appendChild(el('span', 'error', "Couldn't load activity: " + e.message));
  }
}

function refreshAll() { loadMemories(); loadAudit(); }

const addSeg = segmented('private', v => { newVis = v; addSeg.set(v); });
$('addSegSlot').appendChild(addSeg);

$('whoForm').addEventListener('submit', e => { e.preventDefault(); $('answer').textContent = ''; refreshAll(); });
$('askForm').addEventListener('submit', e => { e.preventDefault(); ask(); });
$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('newText').value.trim();
  if (!text) return;
  try {
    await api('/memories', jsonOpts('POST', {uid: uid(), text, visibility: newVis}));
    $('newText').value = '';
    refreshAll();
  } catch (err) { alert("Couldn't save this memory: " + err.message); }
});

refreshAll();
</script>
</body>
</html>
